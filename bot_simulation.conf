# Bot Simulation Configuration File
# This file configures the bot players for automated game simulation
# Command-line options (--bot-simulation N) will override the hands setting

# Number of hands to simulate
# Can be overridden by: --bot-simulation N or --bots N
hands=10

# Bot Player Configuration
# Format: player_name=BotType
# Available bot types: SimpleBot, JulianBot, NullBot
#
# SimpleBot: Medium intelligence, makes strategic decisions
# JulianBot: Advanced bot with hand analysis and half-sequence counting
# NullBot: Minimal bot, always discards default tile and never calls

player1=JulianBot
player2=SimpleBot
player3=JulianBot
player4=SimpleBot

# Player Names (optional, defaults to bot type name)
player1_name=Julian
player2_name=Simple1
player3_name=Julian2
player4_name=Simple2
